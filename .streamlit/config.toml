[theme]
base = "light"
primaryColor = "#118C4F"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F7F8FA"
textColor = "#0F172A"
font = "sans serif"

[theme.sidebar]
primaryColor = "#118C4F"
backgroundColor = "#2B303A"
secondaryBackgroundColor = "#2B303A"
textColor = "#E2E8F0"

[server]
headless = true
port = 8501
address = "0.0.0.0"
enableCORS = false
enableXsrfProtection = false

[browser]
gatherUsageStats = false

[client]
showErrorDetails = true
toolbarMode = "minimal"
